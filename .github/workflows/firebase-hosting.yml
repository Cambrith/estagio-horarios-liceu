name: Deploy automático no Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  testar_e_publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar testes de conflito e validação
        run: node --test testes/validacao.test.js

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LICEUGRADE }}
          channelId: live
          projectId: liceugrade
